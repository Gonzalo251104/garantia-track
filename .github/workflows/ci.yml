name: Application CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [main, develop, 'feature/**', 'release/**', 'hotfix/**']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
